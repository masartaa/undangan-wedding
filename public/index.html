<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Undangan Pernikahan</title>
    <meta name="description" content="Undangan pernikahan akan segera hadir." />
    <style>
      :root {
        --warna-latar: #f9f7f1;
        --warna-utama: #d4af37;
        --warna-aksen: #f3e6b8;
        --warna-teks: #1f1f1f;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: Arial, sans-serif;
        background: linear-gradient(135deg, var(--warna-latar), #fffaf0);
        color: var(--warna-teks);
      }

      .card {
        text-align: center;
        padding: 3rem 1.5rem;
        max-width: 640px;
        width: min(90vw, 640px);
        border: 1px solid rgba(212, 175, 55, 0.3);
        background: rgba(255, 255, 255, 0.7);
        border-radius: 18px;
        box-shadow: 0 12px 32px rgba(31, 31, 31, 0.06);
      }

      h1 {
        margin: 0 0 1rem;
        font-size: clamp(2rem, 5vw, 3rem);
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--warna-utama);
      }

      p {
        margin: 0;
        font-size: 1rem;
        line-height: 1.7;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>Undangan segera hadir</h1>
      <p>Website undangan pernikahan sedang dalam tahap pengembangan.</p>
    </main>
  </body>
</html>
